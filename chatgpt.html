<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChatGPT">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>ChatGPT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;height:100dvh;margin:0;padding:0;background:#000;overflow:hidden}
body{color:#ececec;display:flex;justify-content:center;align-items:center}
:fullscreen,:-webkit-full-screen{background:#000;width:100vw;height:100vh}
.app{width:100vw;height:100vh;height:100dvh;max-width:100%;max-height:100dvh;background:#000;display:flex;flex-direction:column;position:relative;overflow:hidden}
.app.ratio-9-16{aspect-ratio:9/16 !important;height:100vh !important;max-height:100dvh !important;max-width:calc(100dvh * 9 / 16) !important;width:100% !important;margin:auto}
.header{height:auto;min-height:56px;flex-shrink:0;padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;background:#000;width:100%;max-width:780px;margin-left:auto;margin-right:auto}
.header-left,.header-right{display:flex;align-items:center;gap:8px}.header-left{gap:12px}
.icon-btn{width:38px;height:38px;border:0;border-radius:50%;background:#171717;color:#eee;display:flex;align-items:center;justify-content:center;cursor:pointer}
.title{color:#fff;font-size:17px;font-weight:600;cursor:pointer}.title span{color:#888;font-size:10px}
.chat{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px;width:100%;max-width:780px;margin-left:auto;margin-right:auto}
.user-wrap{align-self:flex-end;max-width:82%}.user-message{background:#2f2f2f;color:#fff;padding:10px 16px;border-radius:22px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.ai-wrap{width:100%}.ai-message{color:#ececec;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.thinking{width:14px;height:14px;border-radius:50%;background:#3b82f6;box-shadow:0 0 10px #3b82f6;margin:4px;animation:pulse 1s infinite alternate}
@keyframes pulse{from{transform:scale(.8);opacity:.6}to{transform:scale(1.15);opacity:1}}
.actions{display:flex;align-items:center;gap:15px;margin-top:9px;color:#8e8e93}.action{width:18px;height:18px;border:0;background:none;color:#8e8e93;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.action svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.action.more svg{fill:currentColor;stroke:none}
.bottom{flex-shrink:0;padding:10px max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:#000;width:100%;max-width:780px;margin-left:auto;margin-right:auto}.input-box{width:100%;min-height:48px;max-height:160px;background:#212121;border-radius:25px;display:flex;align-items:flex-end;gap:7px;padding:7px 7px 7px 10px}
.plus{width:34px;height:34px;flex-shrink:0;border:0;background:none;color:#999;font-size:25px;cursor:pointer}
.typing-box{flex:1;min-width:0;height:34px;min-height:34px;max-height:146px;resize:none;border:0;outline:0;background:transparent;color:#fff;font-size:15px;line-height:21px;padding:6px 2px;overflow-x:hidden;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;scrollbar-width:none}
.typing-box::-webkit-scrollbar{display:none}.typing-box::placeholder{color:#888}
.circle{width:34px;height:34px;flex-shrink:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}.mic{background:#2f2f2f;color:#eee}.send{background:#1a73e8;color:white}
.disclaimer{text-align:center;color:#71717a;font-size:11px;margin-top:8px}
.panel{position:absolute;inset:0;z-index:1000;background:#121212;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}.panel.open{transform:translateX(0)}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;margin-bottom:15px;border-bottom:1px solid #2a2a2a}.panel-title{color:#10a37f;font-size:16px;font-weight:bold}
.close{border:0;background:#2a2a2a;color:#ddd;padding:7px 12px;border-radius:6px;cursor:pointer}.group{margin-bottom:13px}.group label{display:block;color:#aaa;font-size:12px;margin-bottom:5px}
.group textarea,.group input,.group select{width:100%;background:#222;color:#fff;border:1px solid #333;border-radius:7px;outline:none;padding:10px;font-size:13px}
.group textarea{height:90px;resize:none}
.buttons{display:flex;gap:10px;margin-top:5px;padding-bottom:30px}.play{flex:2;border:0;border-radius:7px;padding:13px;background:#10a37f;color:#fff;font-weight:bold;font-size:14px;cursor:pointer}.reset{flex:1;border:0;border-radius:7px;padding:13px;background:#333;color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
.play:active,.reset:active,.close:active,.icon-btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div class="header-left">
    <button class="icon-btn" id="menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/></svg></button>
    <div class="title" id="title">ChatGPT <span>▼</span></div>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="newChatBtn" title="New Chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
    <button class="icon-btn" id="dots" title="Script Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </div>
</div>
<div class="chat" id="chat"></div>
<div class="bottom">
  <div class="input-box">
    <button class="plus">+</button>
    <textarea id="typing" class="typing-box" rows="1" readonly placeholder="Message ChatGPT"></textarea>
    <button class="circle mic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
    <button class="circle send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
  </div>
  <div class="disclaimer">ChatGPT can make mistakes. Check important info.</div>
</div>
<div class="panel" id="panel">
  <div class="panel-header"><div class="panel-title">🎬 SCRIPT PANEL</div><button class="close" id="close">✕ Close</button></div>
  <div class="group"><label>📐 Screen Layout</label>
    <select id="ratioSelect">
      <option value="full" selected>📱 Full Screen (Always Full Screen Mode)</option>
      <option value="9-16">📐 9:16 Shorts Box (Centered Frame)</option>
    </select>
  </div>
  <div class="group"><label>👤 USER Lines — Har line ek message</label><textarea id="userLines">Yo, ChatGPT! 👋
Bro… I have some HUGE news. 😳
I have 1 billion subscribers! 🤯🔥
Everyone knows me!
I'M THE KING OF YOUTUBE! 👑</textarea></div>
  <div class="group"><label>🤖 CHATGPT Lines — Har line ek response</label><textarea id="aiLines">Hey! What's up?
Okay... what happened?
WAIT... ONE BILLION?! 💀
Bro, that's absolutely insane.
The King of YouTube has arrived. 👑😂</textarea></div>
  <div class="group"><label>⏱ Start Delay (seconds)</label><input id="startDelay" type="number" value="0.5" step="0.1"></div>
  <div class="group"><label>⌨️ User Typing Speed (ms per letter)</label><input id="speed" type="number" value="40" min="1"></div>
  <div class="group"><label>🔵 Blue Dot Thinking Delay (seconds)</label><input id="thinkingTime" type="number" value="0.8" step="0.1"></div>
  <div class="group"><label>⏱ Delay Between Messages (seconds)</label><input id="messageDelay" type="number" value="1" step="0.1"></div>
  <div class="buttons"><button class="play" id="play">▶ Play</button><button class="reset" id="reset">↻ Reset</button></div>
</div>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
const app=document.querySelector(".app"),ratioSelect=document.getElementById("ratioSelect");
ratioSelect.onchange=function(){
  if(this.value==="9-16")app.classList.add("ratio-9-16");
  else app.classList.remove("ratio-9-16");
};
// Auto full screen on user interaction
function triggerAutoFs(){
  const d=document.documentElement;
  const fn=d.requestFullscreen||d.webkitRequestFullscreen||d.mozRequestFullScreen||d.msRequestFullscreen;
  if(fn&&!document.fullscreenElement&&!document.webkitFullscreenElement){
    fn.call(d).catch(()=>{});
  }
  try{window.scrollTo(0,1);}catch(e){}
}
['click','touchend'].forEach(evt=>document.addEventListener(evt,triggerAutoFs));

typingAudio.loop=true;
typingAudio.volume=0.7;
function startTypingAudio(){try{typingAudio.currentTime=0;const p=typingAudio.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function stopTypingAudio(){typingAudio.pause();try{typingAudio.currentTime=0;}catch(e){}}
function openPanel(){panel.classList.add("open")}function closePanel(){panel.classList.remove("open")}
menu.onclick=openPanel;title.onclick=openPanel;dots.onclick=openPanel;close.onclick=closePanel;
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function resizeTyping(){typing.style.height="34px";

const inputBox = document.querySelector(".input-box");
if (inputBox) {
  inputBox.onclick = function() {
    play.click();
  };
}
const height=typing.scrollHeight;typing.style.height=(height<=146?height:146)+"px";typing.scrollTop=typing.scrollHeight}
function showText(text){typing.value=text;resizeTyping();typing.scrollTop=typing.scrollHeight}
function clearTyping(){typing.value="";typing.style.height="34px";

const inputBox = document.querySelector(".input-box");
if (inputBox) {
  inputBox.onclick = function() {
    play.click();
  };
}
typing.scrollTop=0;stopTypingAudio()}
let runId=0;
reset.onclick=function(){runId++;stopTypingAudio();chat.innerHTML="";clearTyping()};
play.onclick=async function(){
  const thisRun=++runId;stopTypingAudio();
  const userLines=document.getElementById("userLines").value.split(/\r?\n/).filter(x=>x.trim()!=="");
  const aiLines=document.getElementById("aiLines").value.split(/\r?\n/).filter(x=>x.trim()!=="");
  let start=parseFloat(document.getElementById("startDelay").value),speed=parseInt(document.getElementById("speed").value),thinking=parseFloat(document.getElementById("thinkingTime").value),msgDelay=parseFloat(document.getElementById("messageDelay").value);
  if(!Number.isFinite(start))start=.5;if(!Number.isFinite(speed))speed=40;if(!Number.isFinite(thinking))thinking=.8;if(!Number.isFinite(msgDelay))msgDelay=1;
  start=Math.max(0,start)*1000;speed=Math.max(1,speed);thinking=Math.max(0,thinking)*1000;msgDelay=Math.max(0,msgDelay)*1000;
  closePanel();chat.innerHTML="";clearTyping();await wait(start);if(thisRun!==runId)return;
  const turns=Math.max(userLines.length,aiLines.length);
  for(let i=0;i<turns;i++){
    if(thisRun!==runId)return;
    if(userLines[i]){
      const text=userLines[i];startTypingAudio();
      for(let n=1;n<=text.length;n++){
        if(thisRun!==runId){stopTypingAudio();return;}
        showText(text.substring(0,n));await wait(speed);
      }
      stopTypingAudio();await wait(150);if(thisRun!==runId)return;
      const wrap=document.createElement("div");wrap.className="user-wrap";
      const message=document.createElement("div");message.className="user-message";message.textContent=text;
      wrap.appendChild(message);chat.appendChild(wrap);clearTyping();chat.scrollTop=chat.scrollHeight;
    }
    if(aiLines[i]){
      if(thisRun!==runId)return;
      const thinkingRow=document.createElement("div"),dot=document.createElement("div");thinkingRow.className="thinking-row";thinkingRow.appendChild(dot);dot.className="thinking";chat.appendChild(thinkingRow);chat.scrollTop=chat.scrollHeight;
      await wait(thinking);if(thisRun!==runId)return;thinkingRow.remove();
      const aiWrap=document.createElement("div");aiWrap.className="ai-wrap";
      const aiMessage=document.createElement("div");aiMessage.className="ai-message";aiMessage.textContent=aiLines[i];
      const actions=document.createElement("div");actions.className="actions";
      actions.innerHTML=`
      <button class="action" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4 a2 2 0 0 1-2-2V4 a2 2 0 0 1 2-2h9 a2 2 0 0 1 2 2v1"/></svg></button>
      <button class="action" title="Good response"><svg viewBox="0 0 24 24"><path d="M7 10v12H4 a2 2 0 0 1-2-2v-8 a2 2 0 0 1 2-2h3z"/><path d="M7 22h9.5 a2 2 0 0 0 1.9-1.4l2.4-8 A2 2 0 0 0 19 10h-5 l.7-4.2 A3.1 3.1 0 0 0 11.6 2L7 10z"/></svg></button>
      <button class="action" title="Bad response"><svg viewBox="0 0 24 24"><path d="M7 14V2H4 a2 2 0 0 0-2 2v8 a2 2 0 0 0 2 2h3z"/><path d="M7 2h9.5 a2 2 0 0 1 1.9 1.4l2.4 8 A2 2 0 0 1 19 14h-5 l.7 4.2 A3.1 3.1 0 0 1 11.6 22L7 14z"/></svg></button>
      <button class="action" title="Read aloud"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5 a5 5 0 0 1 0 7"/><path d="M18.5 5.5 a9 9 0 0 1 0 13"/></svg></button>
      <button class="action" title="Share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg></button>
      <button class="action more" title="More"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>`;
      actions.querySelector('[title="Copy"]').onclick=()=>{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(aiLines[i]).catch(()=>{});};
      actions.querySelector('[title="Read aloud"]').onclick=()=>{if("speechSynthesis" in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(aiLines[i]));}};
      actions.querySelector('[title="Share"]').onclick=()=>{if(navigator.share)navigator.share({text:aiLines[i]}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(aiLines[i]).catch(()=>{});};
      aiWrap.appendChild(aiMessage);aiWrap.appendChild(actions);chat.appendChild(aiWrap);chat.scrollTop=chat.scrollHeight;await wait(msgDelay);
    }
  }
};
typing.style.height="34px";

const inputBox = document.querySelector(".input-box");
if (inputBox) {
  inputBox.onclick = function() {
    play.click();
  };
}

</script>
